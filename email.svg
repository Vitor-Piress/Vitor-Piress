<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 46" width="260" height="46">
  <defs>
    <style>
      .bg { fill: #151515; rx: 10px;  }
      .icon-box { fill: #1e1e1e; stroke: #EA433566; stroke-width: 1.2px; rx: 7px; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 700; fill: #e4e2e2; }
      .sub { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 9.5px; fill: #9ca3af; }
      
      @keyframes pulse-glow {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      .pulse { animation: pulse-glow 2.2s ease-in-out infinite; }
    </style>
  </defs>

  <g transform="translate(8, 0)">
    <rect class="bg" x="0.5" y="0.5" width="251" height="45" rx="10" />

    <g transform="translate(8, 8)">
      <rect class="icon-box" width="30" height="30" rx="7" />
      <rect x="6" y="8.5" width="18" height="13" rx="2" fill="#1e1e1e" stroke="#EA4335" stroke-width="1.5" />
      <path d="M6.5 9.5L15 15.8L23.5 9.5" fill="none" stroke="#EA4335" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="pulse" />
    </g>

    <text x="46" y="20" class="label">Email Contato</text>
    <text x="46" y="33" class="sub">vitorspires25@gmail.com</text>

    <circle cx="236" cy="14" r="3" fill="#3ECF8E" class="pulse" />
  </g>
</svg>