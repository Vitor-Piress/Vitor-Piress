<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" width="420" height="150">
  <defs>
    <style>
      .bg { fill: #151515; rx: 10px; stroke: #262626; stroke-width: 1px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #e4e2e2; letter-spacing: 0.6px; }
      .sub { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 10px; fill: #3ECF8E; }
      .box { fill: #1e1e1e; stroke: #2d2d2d; stroke-width: 1.2; rx: 10px; }
      
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3.5px); }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }

      .item { animation: float 3.2s ease-in-out infinite; }
      .d1 { animation-delay: 0.0s; }
      .d2 { animation-delay: 0.2s; }
      .d3 { animation-delay: 0.4s; }
      .d4 { animation-delay: 0.6s; }
      .d5 { animation-delay: 0.8s; }
      .d6 { animation-delay: 1.0s; }
      .d7 { animation-delay: 0.15s; }
      .d8 { animation-delay: 0.35s; }
      .d9 { animation-delay: 0.55s; }
      .d10 { animation-delay: 0.75s; }
      .d11 { animation-delay: 0.95s; }
      .d12 { animation-delay: 1.15s; }

      .react-spin {
        transform-origin: 21px 21px;
        animation: spin 10s linear infinite;
      }
      .glow-pulse {
        animation: pulse 2.2s ease-in-out infinite;
      }
    </style>
