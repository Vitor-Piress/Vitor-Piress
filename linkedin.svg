<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 46" width="160" height="46">
  <defs>
    <style>
      .bg { fill: #151515; rx: 10px; }
      .icon-box { fill: #1e1e1e; stroke: #0A66C266; stroke-width: 1.2px; rx: 7px; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 700; fill: #e4e2e2; }
      .sub { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 9.5px; fill: #0A66C2; }
      
      @keyframes pulse-blue {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.65; }
      }
      .pulse { animation: pulse-blue 2.6s ease-in-out infinite; }
    </style>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="159" height="45" rx="10" />

  <!-- Box do Ícone LinkedIn -->
  <g transform="translate(8, 8)">
    <rect class="icon-box" width="30" height="30" rx="7" />
    <rect x="6" y="6" width="18" height="18" rx="3" fill="#0A66C2" class="pulse" />
    <circle cx="10.3" cy="10.3" r="1.35" fill="#ffffff" />
    <rect x="9.1" y="12.8" width="2.4" height="7.2" fill="#ffffff" />
    <path d="M13.2 12.8H15.5V13.8C15.9 13.1 16.7 12.6 17.8 12.6C19.6 12.6 20.6 13.7 20.6 15.8V20H18.2V16.3C18.2 15.2 17.8 14.6 16.9 14.6C15.9 14.6 15.6 15.3 15.6 16.3V20H13.2V12.8Z" fill="#ffffff" />
  </g>

  <!-- Textos -->
  <text x="46" y="20" class="label">LinkedIn</text>
  <text x="46" y="33" class="sub">/in/vitor-pires</text>

  <!-- Seta de Link Externo (Canto Superior Direito) -->
  <path d="M142 16L148 10M148 10H143.5M148 10V14.5" fill="none" stroke="#0A66C2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="pulse" />
</svg>